    const y0=s.pop(),x0=s.pop();if(seen[y0*W+x0]||bar[y0*W+x0])continue;let l=x0,r=x0;
    while(l>0&&!bar[y0*W+l-1]&&!seen[y0*W+l-1])l--;while(r<W-1&&!bar[y0*W+r+1]&&!seen[y0*W+r+1])r++;
    for(let k=l;k<=r;k++){const j=y0*W+k,v=pf&&!pf(k,y0)?C2:C1;seen[j]=1;D[j*4]=v[0];D[j*4+1]=v[1];D[j*4+2]=v[2];D[j*4+3]=255;
      if(y0>0&&!seen[j-W]&&!bar[j-W])s.push(k,y0-1);if(y0<H-1&&!seen[j+W]&&!bar[j+W])s.push(k,y0+1)}
  }
  pc.putImageData(img,0,0);dirty=1;
}
const rnd=n=>(Math.random()-.5)*2*n;
function pos(ev){const r=$('#line').getBoundingClientRect();return[(ev.clientX-r.left)*W/r.width,(ev.clientY-r.top)*H/r.height]}
function line(a,b,lw,col,al){pc.globalAlpha=al||1;pc.strokeStyle=col;pc.lineWidth=lw;pc.lineCap=pc.lineJoin='round';pc.beginPath();pc.moveTo(a[0],a[1]);pc.lineTo(b[0]+.01,b[1]);pc.stroke();pc.globalAlpha=1}
function spark(x,y,r){pc.beginPath();pc.moveTo(x,y-r);pc.quadraticCurveTo(x,y,x+r,y);pc.quadraticCurveTo(x,y,x,y+r);pc.quadraticCurveTo(x,y,x-r,y);pc.quadraticCurveTo(x,y,x,y-r);pc.fill()}
function seg(a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/3)),sp=Math.hypot(dx,dy);
  switch(tool){
    case'brush':line(a,b,size*(1.1-Math.min(sp,30)/150),color);break;
    case'pencil':line(a,b,size*.2+1.5,color,.92);break;
    case'eraser':line(a,b,size*1.6,'#fff');break;
    case'marker':pc.putImageData(base,0,0);pc.globalAlpha=.65;pc.strokeStyle=color;pc.lineWidth=size*.9;pc.lineCap=pc.lineJoin='round';pc.beginPath();pc.moveTo(pts[0][0],pts[0][1]);pts.forEach(p=>pc.lineTo(p[0]+.01,p[1]));pc.stroke();pc.globalAlpha=1;break;
    case'spray':pc.fillStyle=color;pc.globalAlpha=.55;for(let k=0;k<n;k++){const px=a[0]+dx*k/n,py=a[1]+dy*k/n;for(let m=0;m<size*.9;m++){const g=(Math.random()+Math.random()+Math.random()-1.5)*size*.9,h=(Math.random()+Math.random()+Math.random()-1.5)*size*.9;pc.fillRect(px+g,py+h,2,2)}}pc.globalAlpha=1;break;
    case'shine':line(a,b,size*.7,color,.3);for(let k=0;k<n;k++){const px=a[0]+dx*k/n+rnd(size*.5),py=a[1]+dy*k/n+rnd(size*.5);if(Math.random()<.35){pc.fillStyle=Math.random()<.5?'#fff':'#FFC857';spark(px,py,3+Math.random()*size*.25)}}break;
  }
}
const stg=$('#stage');let fingers=0;
stg.addEventListener('pointerdown',ev=>{
  ev.preventDefault();const p=pos(ev);
  if(tool==='fill'||tool==='pattern'){fill(p[0],p[1]);sfx(500+Math.random()*300,.1);return}
  if(tool==='outline'){LC=color;lc.clearRect(0,0,W,H);drawLines(lc,PIC[cur.pic],1);dirty=1;return}
  stg.setPointerCapture(ev.pointerId);snap();down=true;last=p;pts=[p];if(tool==='marker')base=pc.getImageData(0,0,W,H);seg(p,p);
});
stg.addEventListener('pointermove',ev=>{if(!down)return;ev.preventDefault();const p=pos(ev);pts.push(p);seg(last,p);last=p});
['pointerup','pointercancel'].forEach(t=>stg.addEventListener(t,()=>{if(down){down=false;dirty=1}}));

/* ===== start ===== */
go('splash');
</script>
